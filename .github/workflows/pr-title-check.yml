name: Validate Pull Request Title

on:
  pull_request:
    types: [edited, opened, reopened, synchronize]

permissions: {}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  validate-title:
    name: Validate Pull Request Title Format
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Pull Request Title Against Allowed Formats
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          conventional_commit_regex="$(cat .githooks/conventional-commit.pattern)"
          issue_reference_regex="^\[[A-Z0-9]+-[0-9]+\] — .+$"

          if [[ "$PR_TITLE" =~ $conventional_commit_regex ]] || [[ "$PR_TITLE" =~ $issue_reference_regex ]]; then
            printf "\e[32mThe pull request title meets one of the allowed formats.\e[0m\n"
            exit 0
          fi

          printf "\e[31mThe pull request title does not meet any of the allowed formats.\e[0m\n"
          echo "Evaluated pull request title:"
          echo "  ${PR_TITLE}"
          echo
          echo "Examples of valid titles:"
          echo "  <type>: <description>          for example: feat(login): add the 'remember me' button"
          echo "  [ISSUE-XXXX] — <description>   for example: [ABC-123] — add the 'remember me' button"
          echo "Further details are provided at https://www.conventionalcommits.org/en/v1.0.0/#summary"
          exit 1
