name: Validate Branch Name

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  validate-branch-name:
    name: Validate Branch Name Format
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Branch Name Against Naming Convention
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          branch_name_regex="$(cat .githooks/branch-name.pattern)"

          # Dependabot creates its branches under the fixed 'dependabot/' prefix, which cannot be configured.
          if [[ "$PR_AUTHOR" == "dependabot[bot]" ]]; then
            echo "The branch has been created by Dependabot and is excluded from validation."
            exit 0
          fi

          # The default branch is excluded, in line with the pre-push hook.
          if [[ "$BRANCH_NAME" == "$DEFAULT_BRANCH" ]]; then
            echo "The branch is the default branch and is excluded from validation."
            exit 0
          fi

          if [[ "$BRANCH_NAME" =~ $branch_name_regex ]]; then
            printf "\e[32mThe branch name meets the required naming convention.\e[0m\n"
            exit 0
          fi

          printf "\e[31mThe branch name does not meet the required naming convention.\e[0m\n"
          echo "Evaluated branch name:"
          echo "  ${BRANCH_NAME}"
          echo
          echo "Expected format:"
          echo "  <type>/<short-description>   for example: feat/add-authentication"
          echo
          echo "Push the branch under a compliant name, open a new pull request, and close this one:"
          echo "  git push -u origin <local-branch>:<new-name>"
          echo "Further details are provided in the Branch Naming section of CONTRIBUTING.md."
          exit 1
